[build-system]
requires = ["setuptools", "cython"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 79
target-version = ['py39']

[tool.coverage.run]
omit = [
    "setup.py",
    "benchmark.py"
]

[project]
name = "autode"
version = "0.1.0"
description = "autode"
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "rdkit",
    "numpy",
    "networkx",
    "matplotlib",
    "pillow>=9.5.0",
    "cython",
    "scipy",
    "loky",
    "pyscf[dispersion]==2.11.0",
    "ipykernel",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
gpu4pyscf = [
    "cutensor-cu12==2.2.0",
    "cupy-cuda12x==13.4.1",
    "gpu4pyscf-cuda12x==1.4.3",
    "nvidia-cublas-cu12==12.1.3.1",
    "nvidia-cusolver-cu12==11.4.5.107",
    "nvidia-cuda-nvrtc-cu12==12.1.105",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if\\s+(typing\\.)?TYPE_CHECKING:"
]

[tool.mypy]
# disallow_untyped_defs = true
